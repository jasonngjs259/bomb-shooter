<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#0B0420" />
    <title>%WEB_TITLE%</title>
    <!-- Start the ~8MB Skia CanvasKit download right away, in parallel with the JS bundle -->
    <link rel="preload" href="/canvaskit.wasm" as="fetch" type="application/wasm" crossorigin="anonymous" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0b0420;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        background: #0b0420;
      }
    </style>
    <!-- Pre-boot splash: pure HTML/CSS, visible before any JS or WASM loads.
         Removed by the app (src/ui/bootSplash.web.ts) once it has mounted. -->
    <style id="boot-splash-style">
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: radial-gradient(ellipse at 50% 62%, #3a0a5e 0%, #1a0638 38%, #0b0420 75%);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        transition: opacity 300ms ease-out;
      }
      #boot-splash.boot-hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .logo {
        margin: 0;
        text-align: center;
        font-size: clamp(34px, 11vw, 72px);
        font-weight: 900;
        line-height: 1.05;
        letter-spacing: 0.06em;
        color: #f5f3ff;
        -webkit-text-stroke: 1px #22f2ff;
        text-shadow: 0 0 10px #ff3dcb, 0 0 26px #ff3dcb, 0 0 48px rgba(255, 61, 203, 0.6);
        animation: boot-flicker 2.4s infinite;
      }
      #boot-splash .bar {
        width: min(220px, 60vw);
        height: 4px;
        border-radius: 2px;
        background: rgba(124, 92, 255, 0.25);
        overflow: hidden;
      }
      #boot-splash .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #22f2ff, #ff3dcb);
        box-shadow: 0 0 12px #ff3dcb;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      #boot-splash .msg {
        color: #b9aedc;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.3em;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @keyframes boot-flicker {
        0%, 100% { opacity: 1; }
        92% { opacity: 1; }
        94% { opacity: 0.55; }
        96% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .logo { animation: none; }
        #boot-splash .bar::after { animation: none; width: 100%; }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to play Bomb Shooter.</noscript>
    <div id="boot-splash" role="status" aria-label="Loading Bomb Shooter">
      <p class="logo">BOMB<br />SHOOTER</p>
      <div class="bar"></div>
      <div class="msg" id="boot-splash-msg">LOADING</div>
    </div>
    <!-- The root element for the Expo app. -->
    <div id="root"></div>
  </body>
</html>
